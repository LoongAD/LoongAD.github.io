<script>
(function () {
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById('theme-btn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
  });

  const ALL = window.EXPERIMENTS || [];
  document.getElementById('f-lab').textContent = ALL.length;

  /* 节数 / 知识点 / 方程式：按数据实时统计，避免写死 */
  (function stats() {
    const U = [...(window.KD_UPPER || []), ...(window.KD_LOWER || [])];
    const P = window.KD_PRACTICE || {};
    let sec = 0, pt = 0;
    const eq = new Set();
    U.forEach(u => {
      const extra = P[u.id] || [];
      [...u.sections, ...extra].forEach(s => {
        sec++; pt += s.points.length;
        s.points.forEach(p => (p.eq || []).forEach(e => eq.add(e)));
      });
    });
    document.getElementById('f-sec').textContent = sec;
    document.getElementById('f-pt').textContent = pt;
    document.getElementById('f-eq').textContent = eq.size;
    const ms = document.getElementById('more-sec');
    if (ms) ms.textContent = sec;
  })();
  const mn = document.getElementById('more-n');
  if (mn) mn.textContent = ALL.length;

  const PICKS = ['u1-02', 'u3-01', 'u6-01', 'd7-03'];
  document.getElementById('lab-rows').innerHTML = PICKS
    .map(id => ALL.find(e => e.id === id))
    .filter(Boolean)
    .map(e => `<a class="row" href="lab.html?id=${e.id}">
      <span class="row-no">${e.code}</span>
      <span class="row-t">${e.title}</span>
      <span class="row-d">${(e.opening || '').replace(/<[^>]+>/g, '')}</span>
      <span class="row-x">${e.kind} →</span>
    </a>`).join('');

  document.getElementById('kb-rows').innerHTML = (window.KD_UPPER || []).slice(0, 4)
    .map((u, i) => `<a class="row" href="knowledge.html#${u.id}">
      <span class="row-no">${String(i + 1).padStart(2, '0')}</span>
      <span class="row-t">${u.name}</span>
      <span class="row-d">${u.sections.map(s => s.title).join(' · ')}</span>
      <span class="row-x">${u.sections.length} 节 →</span>
    </a>`).join('');

  const R = window.RESOURCES || [];
  document.getElementById('paper-count').textContent = `${R.length} 份`;
  document.getElementById('paper-rows').innerHTML = R.slice(0, 6).map(r => `
    <a class="row" href="${r.file}" target="_blank" rel="noopener">
      <span class="row-no">${r.format || 'DOC'}</span>
      <span class="row-t">${r.title}</span>
      <span class="row-d">${r.desc || ''}</span>
      <span class="row-x">${r.date || ''} ↗</span>
    </a>`).join('');
})();
</script>
