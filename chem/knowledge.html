<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识点 · 化学</title>
<meta name="description" content="鲁教版九年级化学上下册 11 个单元、44 节知识点（含 9 个跨学科实践），含化学方程式与易错提醒。">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a class="logo" href="index.html">
      <span class="logo-mark">化</span>
      <span class="logo-txt">化学实验</span>
      <span class="logo-sub">鲁教版九年级</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="labs.html">实验</a>
      <a href="knowledge.html" class="on">知识点</a>
      <a href="resources.html">资料</a>
      <a href="quiz.html" class="hide-sm">自测</a>
    </nav>
    <div class="head-act">
      <a class="icon-btn" href="search.html" aria-label="搜索" title="搜索">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
        </svg>
      </a>
      <button class="icon-btn" id="theme-btn" aria-label="切换深浅色" title="切换深浅色">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap kb-wrap">
  <aside class="kb-toc" id="toc" aria-label="单元目录"></aside>
  <div class="kb-main">
  <div class="page-head">
    <div class="crumb"><a href="index.html">首页</a><span>/</span>知识点</div>
    <h1><span class="idx" id="n-unit">11</span>知识点总览</h1>
    <p class="lead">按教材顺序编排，含 9 个跨学科实践活动。每条按考点组织：要点、方程式、易错提醒。点节标题展开。</p>
  </div>

  <div class="filters">
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="上册">上册</button>
    <button class="chip" data-f="下册">下册</button>
    <button class="chip" id="expand">全部展开</button>
    <button class="chip" id="collapse">全部收起</button>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
      </svg>
      <input type="text" id="q" placeholder="搜索知识点，如「沉淀」" aria-label="搜索知识点">
    </div>
  </div>

  <div id="list" style="padding-bottom:64px"><div class="loading">正在加载知识点…</div></div>
  </div>
</main>

<footer class="site-foot">
  <div class="wrap">
    <span class="fl">化学实验</span>
    <span>鲁教版九年级 · 教学辅助</span>
    <span class="spacer"></span>
    <span>共 <span id="foot-c">—</span></span>
  </div>
</footer>

<script src="data/kd-upper.js"></script>
<script src="data/kd-lower.js"></script>
<script src="data/kd-practice.js"></script>
<script src="data/ex-upper.js"></script>
<script src="data/ex-lower.js"></script>
<script>
(function () {
  const UNITS = [...(window.KD_UPPER || []), ...(window.KD_LOWER || [])];

  /* 节 → 实验（按教材内容对应，只列直接相关的） */
  const SEC_LAB = {
    '1-3': ['u1-01', 'u1-02', 'u1-03'],
    '3-1': ['u3-01'], '3-2': ['u3-02'], '3-3': ['u3-03'],
    '4-1': ['u4-01'], '4-2': ['u4-02'], '4-3': ['u4-02'],
    '5-1': ['u5-01'],
    '6-1': ['u6-01'], '6-2': ['u6-02'],
    '7-1': ['d7-04'], '7-2': ['d7-05'], '7-3': ['d7-01', 'd7-02'], '7-4': ['d7-03'],
    '8-1': ['d8-01'], '8-2': ['d8-01'], '8-3': ['d8-02'],
    '9-1': ['d9-03'], '9-2': ['d9-01'], '9-3': ['d9-02']
  };

  /* 跨学科实践：按单元合并到对应章节末尾 */
  (function mergePractice() {
    const P = window.KD_PRACTICE || {};
    let n = 0;
    UNITS.forEach(u => {
      (P[u.id] || []).forEach(s => {
        n++;
        s.no = n;
        s.title = `跨学科实践活动${n}　${s.title}`;
        u.sections.push(s);
      });
    });
  })();
  const listEl = document.getElementById('list');
  const q = document.getElementById('q');
  let filter = 'all';
  let openSet = new Set();

  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById('theme-btn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
  });

  document.getElementById('n-unit').textContent = UNITS.length;

  /* 侧边目录 */
  const tocEl = document.getElementById('toc');
  function renderToc() {
    tocEl.innerHTML = `<div class="toc-h">目录</div>` + UNITS.map((u, i) =>
      `<a class="toc-i" href="#${u.id}" data-u="${u.id}">
        <span class="toc-n">${String(i + 1).padStart(2, '0')}</span>
        <span>${u.name}</span>
      </a>`).join('');
    tocEl.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        const el = document.getElementById(a.dataset.u);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }
  renderToc();

  /* 转义 + 把 =条件= 标红 */
  function esc(s) {
    return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }
  function rich(s) {
    return esc(s).replace(/=([^=]{1,14})=/g,
      (m, c) => `<b>=${c}=</b>`);
  }

  function plain(u) {
    const parts = [u.name];
    u.sections.forEach(s => {
      parts.push(s.title);
      s.points.forEach(p => {
        parts.push(p.t);
        (p.li || []).forEach(x => parts.push(x));
        (p.eq || []).forEach(x => parts.push(x));
        if (p.tip) parts.push(p.tip);
      });
    });
    return parts.join(' ').replace(/<[^>]+>/g, '');
  }

  function labLink(s) {
    const ids = s.lab ? [s.lab] : (SEC_LAB[s.id] || []);
    const labs = ids.map(id => (window.EXPERIMENTS || []).find(e => e.id === id)).filter(Boolean);
    if (!labs.length) return '';
    const first = labs[0];
    const more = labs.length > 1 ? ` 等 ${labs.length} 个` : '';
    return ` · <a href="lab.html?id=${first.id}" onclick="event.stopPropagation()">实验 ${first.code}${more} →</a>`;
  }

  function secHTML(s, unitId, idx) {
    const id = unitId + '-' + s.id;
    const open = openSet.has(id);
    const pts = s.points.map(p => `
      <div class="pt">
        <div class="pt-t">${esc(p.t)}</div>
        ${p.li ? `<ul>${p.li.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
        ${p.eq ? p.eq.map(e => `<div class="eq">${rich(e)}</div>`).join('') : ''}
        ${p.tip ? `<div class="tip">${p.tip}</div>` : ''}
      </div>`).join('');
    return `<div class="sec ${open ? 'open' : ''}" data-sec="${id}">
      <div class="sec-h">
        <span class="sec-no${s.practice ? ' prac' : ''}">${s.practice ? '跨' : s.id}</span>
        <span class="sec-t">${esc(s.title)}</span>
        <span class="sec-c">${s.points.length} 个知识点${s.tag ? ' · ' + s.tag : ''}${labLink(s)}</span>
      </div>
      <div class="sec-b">${pts}</div>
    </div>`;
  }

  function render() {
    const kw = q.value.trim().toLowerCase();
    let html = '';

    UNITS.forEach((u, ui) => {
      if (filter !== 'all' && u.book !== filter) return;
      if (kw && !plain(u).toLowerCase().includes(kw)) return;

      const secs = u.sections.filter(s => {
        if (!kw) return true;
        const t = (s.title + ' ' + s.points.map(p =>
          p.t + ' ' + (p.li || []).join(' ') + ' ' + (p.eq || []).join(' ') + ' ' + (p.tip || '')
        ).join(' ')).replace(/<[^>]+>/g, '').toLowerCase();
        return t.includes(kw);
      });
      if (!secs.length) return;

      html += `<section class="kb-unit" id="${u.id}">
        <div class="kb-unit-h">
          <span class="kb-unit-no">${String(ui + 1).padStart(2, '0')}</span>
          <div>
            <div class="kb-unit-t">${esc(u.name)}</div>
            <div class="kb-unit-m">${u.book} · ${secs.length} 节 · ${secs.reduce((a, s) => a + s.points.length, 0)} 个知识点</div>
          </div>
          <span class="kb-unit-x">${u.book}</span>
        </div>
        ${secs.map(s => secHTML(s, u.id, ui)).join('')}
      </section>`;
    });

    listEl.innerHTML = html || '<div class="loading">没有匹配的知识点。</div>';

    /* 搜索时自动展开 */
    if (kw) {
      listEl.querySelectorAll('.sec').forEach(el => el.classList.add('open'));
      openSet = new Set([...listEl.querySelectorAll('.sec')].map(el => el.dataset.sec));
    }

    listEl.querySelectorAll('.sec-h').forEach(h => {
      h.addEventListener('click', () => {
        const sec = h.parentElement;
        const id = sec.dataset.sec;
        sec.classList.toggle('open');
        if (sec.classList.contains('open')) openSet.add(id); else openSet.delete(id);
      });
    });

    /* 目录高亮 */
    const units = [...listEl.querySelectorAll('.kb-unit')];
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          tocEl.querySelectorAll('.toc-i').forEach(a =>
            a.classList.toggle('on', a.dataset.u === en.target.id));
        }
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    units.forEach(u => io.observe(u));

    const nSec = listEl.querySelectorAll('.sec').length;
    const nPt = listEl.querySelectorAll('.pt').length;
    document.getElementById('foot-c').textContent = `${nSec} 节 · ${nPt} 个知识点`;
  }

  document.querySelectorAll('.chip[data-f]').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.toggle('on', x === b));
      filter = b.dataset.f;
      render();
    });
  });
  document.getElementById('expand').addEventListener('click', () => {
    listEl.querySelectorAll('.sec').forEach(el => { el.classList.add('open'); openSet.add(el.dataset.sec); });
  });
  document.getElementById('collapse').addEventListener('click', () => {
    openSet.clear();
    listEl.querySelectorAll('.sec').forEach(el => el.classList.remove('open'));
  });
  q.addEventListener('input', render);

  /* 首次：展开第一节做示范 */
  if (UNITS[0] && UNITS[0].sections[0]) openSet.add(UNITS[0].id + '-' + UNITS[0].sections[0].id);
  render();

  if (location.hash) {
    const el = document.getElementById(location.hash.slice(1));
    if (el) el.scrollIntoView({ block: 'start' });
  }
})();
</script>
</body>
</html>
